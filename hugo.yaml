baseURL: https://huizhenlai.github.io/blog/
languageCode: zh-cn
defaultContentLanguage: zh-cn
title: voidpxL's blog
theme: 'PaperMod'
mainSections:
  - posts

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

outputs:
  home:
    - HTML
    - RSS
    - JSON


minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: voidpxL's blog
  description: "聚焦雷达感知、视觉算法、多传感器融合与工程实践的技术博客。"
  keywords: [Radar, Vision, Fusion, Blog, Engineering]
  author: voidpxL
  # author: ["Me", "You"] # multiple authors
  images: ["assets/icons/voidpxl-mark.svg"]
  DateFormat: "2025-01-02"
  defaultTheme: auto # dark, light
  disableThemeToggle: false
  math : true
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false
  disableSchema: false
  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "assets/icons/voidpxl-mark.svg"
    favicon16x16: "assets/icons/voidpxl-mark.svg"
    favicon32x32: "assets/icons/voidpxl-mark.svg"
    apple_touch_icon: "assets/icons/voidpxl-mark.svg"
    safari_pinned_tab: "assets/icons/voidpxl-mark.svg"

  label:
    text: "voidpxL"
    icon: "assets/icons/voidpxl-mark.svg"
    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: false # needs to be explicitly set
    title: voidpxL
    subtitle: "雷达 / 视觉 / 融合感知 / 工程实践"
    imageUrl: "assets/icons/voidpxl-mark.svg"
    imageWidth: 120
    imageHeight: 120
    imageTitle: voidpxL
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  # home-info mode
  homeInfoParams:
    Title: "欢迎来到 voidpxL 的技术博客"
    Content: >
      主要记录以下内容：

      1. 算法与工程流程总结

      2. 技术学习与实验记录

      3. 论文阅读、方法拆解与复现

  socialIcons:
    - name: github
      url: "https://github.com/voidpxl"
    - name: zhihu
      url: "https://www.zhihu.com/"
    - name: qq
      url: "https://qq.com"
    - name: bilibili
      url: "https://www.bilibili.com"

  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page

  editPost:
    URL: "https://github.com/huizhenlai/blog/blob/gh-pages/content"
    Text: "在 GitHub 上编辑"
    appendFilePath: true # to append file path to Edit link

# for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
menu:
  main:
    - identifier: about
      name: 关于
      url: /about/
      weight: 5
    - identifier: series
      name: 系列
      url: /series/
      weight: 8
    - identifier: archive
      name: 归档
      url: /archives/
      weight: 10
    - identifier: Search
      name: 搜索
      url: /search/
      weight: 20
    - identifier: Tags
      name: 标签
      url: /tags/
      weight: 30
    - identifier: Me
      name: 主页
      url: https://voidpxl.github.io
      weight: 40
taxonomies:
  category: categories
  tag: tags
  series: series
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai
