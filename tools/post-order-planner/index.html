<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文章排序与 Taxonomy 规划器</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <div>
        <p class="eyebrow">Blog Planner</p>
        <h1>文章排序与 Taxonomy 规划器</h1>
        <p class="hero-text">统计当前已有的 <code>tags</code> 和 <code>series</code>，展示所有文章及其 <code>weight</code>，支持拖拽调整顺序并批量写回 front matter。</p>
      </div>
      <div class="hero-actions">
        <button id="reload-btn" class="secondary-btn">重新加载</button>
        <button id="save-btn" class="primary-btn">保存排序</button>
      </div>
    </section>

    <section class="toolbar">
      <label class="search-box">
        <span>搜索文章</span>
        <input id="search-input" type="search" placeholder="按标题、路径、tag、series 过滤">
      </label>
      <label class="check-box">
        <input id="hide-drafts" type="checkbox">
        <span>隐藏草稿</span>
      </label>
      <div class="hint-box">
        <strong>拖拽状态</strong>
        <span id="drag-hint">已启用</span>
      </div>
    </section>

    <section class="top-grid">
      <section class="stats-grid">
        <article class="stat-card">
          <span class="stat-label">文章总数</span>
          <strong id="stat-total-posts">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">精选文章</span>
          <strong id="stat-featured-posts">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">草稿数量</span>
          <strong id="stat-draft-posts">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">标签总数</span>
          <strong id="stat-total-tags">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">系列总数</span>
          <strong id="stat-total-series">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">修改状态</span>
          <strong id="stat-dirty">未修改</strong>
        </article>
      </section>

      <section class="taxonomy-grid">
        <article class="taxonomy-card">
          <div class="taxonomy-card-head">
            <h2>Tags</h2>
            <span id="tag-count-pill" class="count-pill">0</span>
          </div>
          <div id="tag-cloud" class="taxonomy-cloud"></div>
        </article>
        <article class="taxonomy-card">
          <div class="taxonomy-card-head">
            <h2>Series</h2>
            <span id="series-count-pill" class="count-pill">0</span>
          </div>
          <div id="series-cloud" class="taxonomy-cloud"></div>
        </article>
      </section>
    </section>

    <section class="list-shell">
      <div class="list-header">
        <div>保存时会把当前顺序连续写回为 <code>weight: 1..N</code>。搜索或隐藏草稿时禁用拖拽，避免不可见项被错误排序。</div>
        <div id="visible-count">显示 0 篇</div>
      </div>
      <ul id="post-list" class="post-list"></ul>
      <div id="empty-state" class="empty-state" hidden>没有匹配的文章。</div>
    </section>

    <section class="status-shell">
      <div id="status-bar" class="status-bar">准备就绪。</div>
    </section>
  </main>

  <template id="post-item-template">
    <li class="post-item" draggable="true">
      <div class="drag-handle" title="拖拽排序">⋮⋮</div>
      <div class="post-main">
        <div class="post-topline">
          <span class="weight-badge"></span>
          <span class="featured-badge" hidden>精选</span>
          <span class="draft-badge" hidden>草稿</span>
        </div>
        <h2 class="post-title"></h2>
        <div class="meta-row">
          <span class="post-date"></span>
          <span class="post-series"></span>
        </div>
        <div class="tag-row"></div>
        <div class="post-path"></div>
      </div>
    </li>
  </template>

  <script src="./app.js"></script>
</body>
</html>
